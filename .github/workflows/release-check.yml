name: Release check

# Mounts through the published packages themselves, as a user would get them.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest, asset: "*-linux-x64.tar.gz", bin: "." }
          - { name: linux-arm64, os: ubuntu-24.04-arm, asset: "*-linux-arm64.tar.gz", bin: "." }
          - { name: macos-arm64, os: macos-latest, asset: "*-macos.zip", bin: "bin/arm64" }
          - { name: macos-intel, os: macos-15-intel, asset: "*-macos.zip", bin: "bin/x64" }
    name: package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install FUSE
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install macos-fuse-t/homebrew-cask/fuse-t
          else
            sudo apt-get update
            sudo apt-get install -y fuse3
          fi
      - name: Download the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --pattern "${{ matrix.asset }}" --dir package
      - name: Unpack
        working-directory: package
        run: |
          case "$(ls)" in
            *.zip) unzip -q ./* ;;
            *) tar xzf ./* ;;
          esac
      - name: Run it
        run: |
          cd package/MLV-Drive-*/
          sha256sum -c SHA256SUMS.txt 2>/dev/null || shasum -a 256 -c SHA256SUMS.txt
          if [ "$RUNNER_OS" = macOS ]; then
            # what "MLV Drive.command" does before starting the drive
            xattr -dr com.apple.quarantine . 2>/dev/null || true
            codesign --force --sign - "${{ matrix.bin }}/mlvdrive-cli"
            codesign --force --sign - "${{ matrix.bin }}/MLVDrive"
          fi
          bash "$GITHUB_WORKSPACE/build/smoke.sh" "${{ matrix.bin }}/MLVDrive" "${{ matrix.bin }}/mlvdrive-cli"
